  tests_timeout: 30

  checkpoint_interval: 5
  
  overwrite_results: false
  
  results_dir: ./data/results/evalplus/

  judge_results_dir: ./data/results/evalplus/judge/

dataset:
  # dataset_load: fraction of the judged dataset to use (0-1).
  # recomendado: 0.3-1.0 para testes rapidos vs. treino completo.
  dataset_load: 1.0
  # correct_size: fraction of "correct" samples to keep (0-1).
  # recomendado: 0.2-0.6 para reduzir desbalanceamento.
  correct_size: 0.5
  # random_seed: seed for shuffling and split reproducibility.
  random_seed: 42
  # test_size: fraction reserved for evaluation split (0-1).
  # recomendado: 0.1-0.2.
  validation_size: 0.15
  test_size: 0.2

training:
  # Busca TPE do Optuna, persistida em results_dir/optuna_trials.db.
  search_strategy: optuna
  random_seed: 42
  # Total de configurações treinadas ou que falharam; a execução pode ser retomada.
  max_trials: 10
  # Número de tentativas aleatórias antes de o TPE usar os resultados observados.
  optuna_startup_trials: 5
  # Use a distinct study when changing target or loss strategy; historical
  # accuracy-only trials do not contain Macro F1/Recall.
  optuna_study_name: hallucination_detection_macro_f1_weighted
  # Primary Optuna metric: accuracy, macro_f1, or macro_recall.
  optuna_target: macro_f1
  # standard = ordinary SFT token loss; label_weighted emphasizes class labels.
  classification_loss_strategy: label_weighted
  classification_loss_weight: 3.0

  # model: Hugging Face model id used for SFT.
  # recomendado: google/gemma-3-4b-it ou google/gemma-3-1b-it.
  models: 
    - google/gemma-3-4b-it
    - google/gemma-4-E2B-it
    - google/gemma-4-E4B-it

  # use_qlora: list of booleans for grid search.
  # true = 4-bit QLoRA, false = LoRA full precision.
  use_qlora: [true]

  # lora_r: list of rank values for LoRA adapters.
  # recomendado: [8, 16, 32].
  lora_r: [8, 16, 32]
  # lora_alpha: list of alpha values (scales LoRA updates).
  # recomendado: [8, 16, 32].
  lora_alpha: [8, 16, 32]
  # lora_dropout: list of dropout values.
  # recomendado: [0.0, 0.05, 0.1].
  lora_dropout: [0.05, 0.1]
  # learning_rate: list of learning rates for grid search.
  # recomendado: [5e-5, 2e-5, 1e-4].
  learning_rate: [5e-5, 1e-4]
  bias : ["none", "all", "lora_only"]
  num_epochs : [3,4]
  

  # Modelos mesclados mantidos após a seleção por validação.
  # Separate directory so this weighted experiment cannot evict the prior
  # accuracy-only retained models.
  model_output_dir: /mnt/ssd/HalluCode/models/macro_f1_weighted
  # Checkpoints temporários do Trainer (removidos ao final de cada trial).
  checkpoints_path: /mnt/ssd/HalluCode/checkpoints/macro_f1_weighted

  # max_salved_models: maximum number of saved models kept on disk.
  max_salved_models: 5

evaluation:
  checkpoint_interval: 10
  model_temperature: 0.0
  overwrite : false
  num_ctx: 16384
  think: false
  models:
    - gpt-oss:20b
    - gemma3:4b
    - qwen2.5-coder:7b
    - gemma4:31b
    - muse-glimmer:30b
    - qwen3.8:27b
    - devstral-small-2:24b
    - qwen2.5-coder:32b
    - qwen3-coder:30b
    - glm-4.7-flash:latest
    - ornith-1.5:35b
    - google/gemma-3-4b-it
    - google/gemma-4-E2B-it
    - google/gemma-4-E4B-it
    - trained/gemma-4-e4b-best
